<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | ECHOX</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#0C0E14;
color:#E2E6F0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

body::before{
content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#7C5CFC25,transparent 70%);
top:-250px;
left:-250px;
}

body::after{
content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#22D3EE20,transparent 70%);
bottom:-250px;
right:-250px;
}

.container{
position:relative;
z-index:2;
text-align:center;
padding:40px;
background:rgba(19,21,31,.75);
border:1px solid #23273A;
border-radius:24px;
backdrop-filter:blur(18px);
max-width:650px;
width:90%;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
font-family:'Space Grotesk',sans-serif;
font-size:4rem;
font-weight:700;
background:linear-gradient(135deg,#7C5CFC,#22D3EE);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}

h1{
font-family:'Space Grotesk',sans-serif;
font-size:2.3rem;
margin-bottom:15px;
}

p{
color:#9EA5C3;
font-size:1rem;
line-height:1.8;
margin-bottom:30px;
}

.badge{
display:inline-block;
padding:12px 28px;
background:linear-gradient(135deg,#7C5CFC,#22D3EE);
color:#fff;
font-weight:600;
border-radius:50px;
letter-spacing:1px;
font-size:.9rem;
}

footer{
margin-top:35px;
font-size:.85rem;
color:#6B728E;
}

@media(max-width:600px){
.logo{font-size:3rem;}
h1{font-size:1.8rem;}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">ECHOX</div>

<h1>Website Coming Soon</h1>

<p>
We're building something amazing for developers.<br>
This page is currently under development and will be available soon.
Thank you for your patience.
</p>

<div class="badge">🚀 COMING SOON</div>

<footer>
Copyright © 2025 ECHOX. All Rights Reserved.
</footer>

</div>

</body>
</html>
