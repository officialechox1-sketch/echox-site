<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOX | Coming Soon</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #2a1b5f, #0f0c29);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 40px 25px;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.85;
            margin-bottom: 30px;
        }

        .coming {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .desc {
            font-size: 0.95rem;
            opacity: 0.75;
            line-height: 1.6;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, #8b5cf6, #ec4899);
            margin: 25px auto;
            border-radius: 50px;
        }

        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">ECHOX</div>
        <div class="tagline">Future-ready online shopping experience</div>

        <div class="divider"></div>

        <div class="coming">🚀 Online Store Coming Soon</div>
        <p class="desc">
            We’re building something powerful, fast, and secure.<br>
            Stay tuned for the launch.
        </p>

        <footer>
            © 2025 ECHOX. All rights reserved.
        </footer>
    </div>

</body>
</html>
